<!doctype html>
<html lang=`en`>
<head>
  <meta charset=`UTF-8`>
  <meta name=`viewport` content=`width=device-width, initial-scale=1.0`>
  <title>Directory Index Generator</title>
</head>

<body>

<textarea
  id="input"
  placeholder="Paste cmd dir output here..."
  style="width:100%;height:300px;"
></textarea>

<br><br>

<label>
  Base URL:
  <input
    id="baseUrl"
    type="text"
    value="/"
    style="width:300px;"
  >
</label>

<button id="generateButton">Generate index.html</button>

<br><br>

<textarea
  id="output"
  readonly
  style="width:100%;height:500px;"
></textarea>

<script src="script.js"></script>

</body>
</html>
